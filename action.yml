name: 'Install Qt'
description: 'Install LGPL-only Qt libraries built by giallu/qt-lgpl'

inputs:
  qt-version:
    description: 'Qt package to install: <qt version>-<package release>, e.g. 6.12.0-1'
    required: true
    default: '6.12.0-1'

  os:
    description: 'Runner image the package was built for (windows-2025, ubuntu-22.04, macos-15)'
    required: true
    default: 'ubuntu-22.04'

  verify-attestation:
    description: 'Verify the build provenance attestation of the downloaded package'
    required: false
    default: 'true'

  token:
    description: 'GitHub token used to download the release'
    required: false
    default: ${{ github.token }}

outputs:
  qt-dir:
    description: 'Directory Qt was installed to'
    value: ${{ steps.install.outputs.qt-dir }}

runs:
  using: "composite"
  steps:
    - name: Download Qt package
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        QT_PKG: ${{ inputs.qt-version }}
        QT_OS: ${{ inputs.os }}
      run: |
        echo "Running on: ${{ runner.name }} - ${{ runner.os }} - ${{ runner.arch }}"
        repo=giallu/qt-lgpl
        base="qt-$QT_PKG-${QT_OS//[.-]/}"
        ext=${{ runner.os == 'Windows' && 'zip' || 'tar.xz' }}
        file="$base.$ext"
        cd "$RUNNER_TEMP"
        # current layout: one release per Qt package (tag qt-6.12.0-1) holding every OS
        # legacy layout: one release per OS (tag qt-6.8.1-3-windows2019)
        if ! gh release download "qt-$QT_PKG" -R "$repo" -p "$file" --clobber 2>/dev/null; then
          echo "Not found in release qt-$QT_PKG, trying legacy release $base"
          gh release download "$base" -R "$repo" -p "$file" --clobber
        fi
        if [ "${{ inputs.verify-attestation }}" = "true" ]; then
          gh attestation verify "$file" --repo "$repo"
        fi
        echo "file=$RUNNER_TEMP/$file" >> "$GITHUB_OUTPUT"
        echo "base=$base" >> "$GITHUB_OUTPUT"

    - name: Extract Qt (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dest = "C:\Qt-${{ inputs.qt-version }}"
        Remove-Item -Recurse $dest -ErrorAction silentlycontinue
        Remove-Item -Recurse "C:\${{ steps.download.outputs.base }}" -ErrorAction silentlycontinue
        7z x "${{ steps.download.outputs.file }}" -oC:\
        Move-Item "C:\${{ steps.download.outputs.base }}" $dest
        "QT_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Extract Qt (other OS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        dest="$GITHUB_WORKSPACE/Qt-${{ inputs.qt-version }}"
        echo "Extracting Qt to $dest"
        rm -rf "$dest"
        mkdir -p "$dest"
        tar xf "${{ steps.download.outputs.file }}" -C "$dest" --strip-components 1
        echo "QT_INSTALL_DIR=$dest" >> "$GITHUB_ENV"

    - name: Add Qt to the environment
      id: install
      shell: bash
      run: |
        dir="$QT_INSTALL_DIR"
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "CMAKE_PREFIX_PATH=$dir${CMAKE_PREFIX_PATH:+${{ runner.os == 'Windows' && ';' || ':' }}$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
        echo "qt-dir=$dir" >> "$GITHUB_OUTPUT"
        rm -f "${{ steps.download.outputs.file }}"
