name: 'Install Qt'
description: 'Install LGPL-only Qt libraries built by giallu/qt-lgpl'

inputs:
  qt-version:
    description: >
      Qt package to install: an exact package (<qt version>-<package release>,
      e.g. 6.12.0-1) or the newest published package of an LTS line
      (e.g. 6.12-latest, 6.8-latest)
    required: true
    default: '6.12-latest'

  os:
    description: >
      Build to use (windows-2025, ubuntu-22.04, macos-15). Empty = the build
      matching the runner's platform. The ubuntu-22.04 build also runs on
      newer Ubuntu runners.
    required: false
    default: ''

  verify-attestation:
    description: 'Verify the build provenance attestation of the downloaded package'
    required: false
    default: 'true'

  cache:
    description: 'Cache the downloaded package between workflow runs'
    required: false
    default: 'true'

  token:
    description: 'GitHub token used to download the release'
    required: false
    default: ${{ github.token }}

outputs:
  qt-dir:
    description: 'Directory Qt was installed to'
    value: ${{ steps.install.outputs.qt-dir }}
  qt-package:
    description: 'Resolved package, e.g. 6.12.0-1'
    value: ${{ steps.resolve.outputs.package }}

runs:
  using: "composite"
  steps:
    - name: Resolve Qt package
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        QT_PKG: ${{ inputs.qt-version }}
        QT_OS: ${{ inputs.os }}
      run: |
        echo "Running on: ${{ runner.name }} - ${{ runner.os }} - ${{ runner.arch }}"
        repo=giallu/qt-lgpl

        if [ -z "$QT_OS" ]; then
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)     QT_OS=ubuntu-22.04 ;;
            Windows-X64)   QT_OS=windows-2025 ;;
            macOS-ARM64)   QT_OS=macos-15 ;;
            *) echo "::error::No qt-lgpl build for ${{ runner.os }} ${{ runner.arch }}; set the os input"; exit 1 ;;
          esac
        fi

        if [[ "$QT_PKG" =~ ^([0-9]+\.[0-9]+)-latest$ ]]; then
          line=${BASH_REMATCH[1]}
          QT_PKG=$(gh release list -R "$repo" --exclude-drafts --exclude-pre-releases --limit 200 \
                     --json tagName -q '.[].tagName' \
                   | sed -n "s/^qt-\(${line//./\\.}\.[0-9][0-9]*-[0-9][0-9]*\)$/\1/p" \
                   | sort -t- -k1,1V -k2,2n | tail -1)
          [ -n "$QT_PKG" ] || { echo "::error::No published package for Qt $line"; exit 1; }
          echo "Resolved ${{ inputs.qt-version }} to $QT_PKG"
        fi

        base="qt-$QT_PKG-${QT_OS//[.-]/}"
        ext=${{ runner.os == 'Windows' && 'zip' || 'tar.xz' }}
        {
          echo "package=$QT_PKG"
          echo "base=$base"
          echo "file=$base.$ext"
          echo "dir=${{ runner.temp }}/qt-lgpl-download"
        } >> "$GITHUB_OUTPUT"

    - name: Restore cached package
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: qt-lgpl-${{ steps.resolve.outputs.file }}

    - name: Download Qt package
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        QT_PKG: ${{ steps.resolve.outputs.package }}
        BASE: ${{ steps.resolve.outputs.base }}
        FILE: ${{ steps.resolve.outputs.file }}
        DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        repo=giallu/qt-lgpl
        mkdir -p "$DIR"
        cd "$DIR"
        if [ -f "$FILE" ]; then
          echo "Using cached $FILE"
        # current layout: one release per Qt package (tag qt-6.12.0-1) holding every OS
        # legacy layout: one release per OS (tag qt-6.8.1-3-windows2019)
        elif ! gh release download "qt-$QT_PKG" -R "$repo" -p "$FILE" 2>/dev/null; then
          echo "Not found in release qt-$QT_PKG, trying legacy release $BASE"
          gh release download "$BASE" -R "$repo" -p "$FILE"
        fi
        # verify every time, cached or not
        if [ "${{ inputs.verify-attestation }}" = "true" ]; then
          gh attestation verify "$FILE" --repo "$repo"
        fi
        echo "path=$DIR/$FILE" >> "$GITHUB_OUTPUT"

    - name: Extract Qt (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dest = "C:\Qt-${{ steps.resolve.outputs.package }}"
        $base = "${{ steps.resolve.outputs.base }}"
        Remove-Item -Recurse $dest -ErrorAction silentlycontinue
        Remove-Item -Recurse "C:\$base" -ErrorAction silentlycontinue
        7z x "${{ steps.download.outputs.path }}" -oC:\ | Out-Null
        Move-Item "C:\$base" $dest
        "QT_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Extract Qt (other OS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        dest="$GITHUB_WORKSPACE/Qt-${{ steps.resolve.outputs.package }}"
        echo "Extracting Qt to $dest"
        rm -rf "$dest"
        mkdir -p "$dest"
        tar xf "${{ steps.download.outputs.path }}" -C "$dest" --strip-components 1
        echo "QT_INSTALL_DIR=$dest" >> "$GITHUB_ENV"

    - name: Add Qt to the environment
      id: install
      shell: bash
      run: |
        dir="$QT_INSTALL_DIR"
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "CMAKE_PREFIX_PATH=$dir${CMAKE_PREFIX_PATH:+${{ runner.os == 'Windows' && ';' || ':' }}$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
        echo "qt-dir=$dir" >> "$GITHUB_OUTPUT"
        echo "Installed Qt ${{ steps.resolve.outputs.package }} in $dir"
