name: Build Qt

on:
  workflow_dispatch:
    inputs:
      qt-version:
        description: 'Upstream Qt version, e.g. 6.12.0 or 6.8.5'
        required: true
        type: string
      package-release:
        description: 'Package release number (empty = next free number for this Qt version)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-qt-${{ inputs.qt-version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      qt-version: ${{ steps.vars.outputs.qt-version }}
      qt-line: ${{ steps.vars.outputs.qt-line }}
      release: ${{ steps.vars.outputs.release }}
      tag: ${{ steps.vars.outputs.tag }}
      submodules: ${{ steps.vars.outputs.submodules }}
      submodules-windows: ${{ steps.vars.outputs.submodules-windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version strings
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
          QT_VERSION: ${{ inputs.qt-version }}
          PKG_RELEASE: ${{ inputs.package-release }}
        run: |
          if ! [[ "$QT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::qt-version must look like 6.12.0, got '$QT_VERSION'"; exit 1
          fi
          line=$(echo "$QT_VERSION" | cut -d. -f1-2)
          if ! jq -e --arg l "$line" '.lts_lines | index($l)' config/build.json >/dev/null; then
            echo "::warning::Qt $line is not in lts_lines of config/build.json"
          fi

          if [ -z "$PKG_RELEASE" ]; then
            # next free package release for this Qt version
            last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
                   | sed -n "s/^qt-${QT_VERSION//./\\.}-\([0-9]\+\)$/\1/p" | sort -n | tail -1)
            PKG_RELEASE=$(( ${last:-0} + 1 ))
          fi
          if ! [[ "$PKG_RELEASE" =~ ^[0-9]+$ ]]; then
            echo "::error::package-release must be a number"; exit 1
          fi

          {
            echo "qt-version=$QT_VERSION"
            echo "qt-line=$line"
            echo "release=$PKG_RELEASE"
            echo "tag=qt-$QT_VERSION-$PKG_RELEASE"
            echo "submodules=$(jq -r '.submodules | join(",")' config/build.json)"
            echo "submodules-windows=$(jq -r '(.submodules + .submodules_windows) | join(",")' config/build.json)"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triplet: x64-windows-static
            archive: zip

          - os: ubuntu-22.04      # oldest supported glibc = widest compatibility
            triplet: x64-linux
            archive: tar.xz

          - os: macos-15
            triplet: arm64-osx
            archive: tar.xz

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      QT_VERSION: ${{ needs.prepare.outputs.qt-version }}
      QT_LINE: ${{ needs.prepare.outputs.qt-line }}
      SUBMODULES: ${{ startsWith(matrix.os, 'windows') && needs.prepare.outputs.submodules-windows || needs.prepare.outputs.submodules }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set package name
      shell: bash
      run: |
        os_name=${{ matrix.os }}
        echo "QT_NVR=${{ needs.prepare.outputs.tag }}-${os_name//[.-]/}" >> "$GITHUB_ENV"

    - name: Set up Visual Studio shell
      if: runner.os == 'Windows'
      uses: egor-tensin/vs-shell@7710434f30f873ff4ab78184b74cc576a10726d6 # v2.2.3
      with:
        arch: x64

    # Needed to use GNU patch instead of Strawberry Perl patch
    # https://github.com/actions/runner-images/issues/5459#issuecomment-1532856844
    - name: Set up PATH on Windows
      if: runner.os == 'Windows'
      run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update && sudo apt install -y ninja-build libfontconfig1-dev \
        libfreetype-dev \
        libgl1-mesa-dev \
        libx11-dev \
        libx11-xcb-dev \
        libxcb-cursor-dev \
        libxcb-glx0-dev \
        libxcb-icccm4-dev \
        libxcb-image0-dev \
        libxcb-keysyms1-dev \
        libxcb-randr0-dev \
        libxcb-render-util0-dev \
        libxcb-shape0-dev \
        libxcb-shm0-dev \
        libxcb-sync-dev \
        libxcb-util-dev \
        libxcb-xfixes0-dev \
        libxcb-xinerama0-dev \
        libxcb-xkb-dev \
        libxcb1-dev \
        libxext-dev \
        libxfixes-dev \
        libxi-dev \
        libxkbcommon-dev \
        libxkbcommon-x11-dev \
        libxrender-dev

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: brew install ninja

    # Linux builds failed due to low disk space, apply sugegstion from
    # https://github.com/actions/runner-images/issues/10699#issuecomment-2402475892
    - name: Clean up disk space
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

    - name: Download and verify Qt sources
      shell: bash
      run: |
        file=qt-everywhere-src-$QT_VERSION.tar.xz
        for location in official_releases archive; do
          url=https://download.qt.io/$location/qt/$QT_LINE/$QT_VERSION/single/$file
          if curl -fsSL -o "$file.sha256" "$url.sha256"; then break; fi
          url=
        done
        [ -n "$url" ] || { echo "::error::Qt $QT_VERSION not found on download.qt.io"; exit 1; }

        # The .sha256 is served by download.qt.io itself; the tarball may come
        # from a mirror, so it is checked against that published hash.
        expected=$(grep -oE '[0-9a-f]{64}' "$file.sha256" | head -1)
        [ -n "$expected" ] || { echo "::error::no SHA-256 published for $url"; exit 1; }
        echo "Downloading $url (expected sha256 $expected)"
        curl -fL --retry 3 -o "$file" "$url"
        PY=$(command -v python3 || command -v python)
        echo "PY=$PY" >> "$GITHUB_ENV"
        "$PY" - "$file" "$expected" <<'EOF'
        import hashlib, sys
        path, expected = sys.argv[1], sys.argv[2]
        h = hashlib.sha256()
        with open(path, "rb") as f:
            for chunk in iter(lambda: f.read(1 << 20), b""):
                h.update(chunk)
        if h.hexdigest() != expected:
            sys.exit(f"SHA-256 mismatch for {path}: got {h.hexdigest()}, expected {expected}")
        print(f"SHA-256 OK: {expected}")
        EOF
        echo "QT_SRC_SHA256=$expected" >> "$GITHUB_ENV"
        echo "QT_SRC_URL=$url" >> "$GITHUB_ENV"
        tar xf "$file"
        rm "$file"

    - name: Apply reviewed security patches
      shell: bash
      run: |
        "$PY" scripts/apply_patches.py \
          --src qt-everywhere-src-$QT_VERSION \
          --line $QT_LINE \
          --modules "$SUBMODULES" \
          --report patches-$QT_NVR.md

    - name: Set up vcpkg
      shell: bash
      run: |
        if [ -z "$VCPKG_INSTALLATION_ROOT" ] || [ ! -d "$VCPKG_INSTALLATION_ROOT" ]; then
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_INSTALLATION_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
        fi

    - name: Install dependencies
      shell: bash
      run: |
        "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl --triplet=${{ matrix.triplet }}

    - name: Configure build
      shell: bash
      run: |
        args=(
          -cmake-generator Ninja
          -openssl-linked
          -release
          -qt-libjpeg
          -qt-libpng
          -qt-zlib
          -qt-pcre
          -qt-harfbuzz
          -qt-doubleconversion
          -nomake examples
          -nomake tests
          -submodules "$SUBMODULES"
          -prefix "buildroot/$QT_NVR"
        )
        configure=qt-everywhere-src-$QT_VERSION/configure
        if [ "$RUNNER_OS" = Windows ]; then
          configure+=.bat
          args+=(-opengl dynamic)
        fi
        if [ "$RUNNER_OS" = Linux ]; then
          args+=(-no-use-gold-linker)
        fi
        set -o pipefail
        "$configure" "${args[@]}" -- \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
          -Wno-dev 2>&1 | tee configure.log
        # configure.bat can exit 0 even when CMake failed
        if [ ! -f CMakeCache.txt ] || grep -q "CMake Error" configure.log; then
          echo "::error::configure failed"; exit 1
        fi

    - name: Compile and install
      shell: bash
      run: |
        set -o pipefail
        cmake --build . --parallel 2>&1 | tee build.log
        cmake --install .

    # Surface the reason for a failure as annotations on the run page,
    # so it is visible without opening (or downloading) the full log.
    - name: Report build errors
      if: failure()
      shell: bash
      run: |
        for f in configure.log build.log; do
          [ -f "$f" ] || continue
          {
            grep -E "CMake Error|ERROR|[Ee]rror:|FAILED:|Unknown|unknown" "$f" | head -20
            echo "----- last lines of $f -----"
            tail -30 "$f"
          } > "$f.excerpt"
          msg=$(tr -d '\r' < "$f.excerpt" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=${{ matrix.os }} $f::$msg"
        done

    - name: Create archive
      shell: bash
      run: |
        mkdir dist
        cd buildroot
        if [ "${{ matrix.archive }}" = zip ]; then
          "C:\Program Files\7-Zip\7z.exe" a ../dist/$QT_NVR.zip $QT_NVR
        else
          tar cJf ../dist/$QT_NVR.tar.xz $QT_NVR
        fi
        cd ..
        cp config.summary dist/config-$QT_NVR.summary
        cp config.opt dist/config-$QT_NVR.opt
        mv patches-$QT_NVR.md dist/
        echo "$QT_SRC_SHA256  $QT_SRC_URL" > dist/source-$QT_NVR.sha256

    - name: Upload build output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.QT_NVR }}
        path: dist/
        retention-days: 7
        if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      QT_VERSION: ${{ needs.prepare.outputs.qt-version }}
    steps:
    - name: Download build outputs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true

    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          dist/*.zip
          dist/*.tar.xz

    - name: Write release notes
      run: |
        cd dist
        {
          echo "LGPL-only build of upstream Qt $QT_VERSION (package release ${{ needs.prepare.outputs.release }})."
          echo
          echo "Upstream source: \`$(cut -d' ' -f3 "$(ls source-*.sha256 | head -1)")\`"
          echo "Source SHA-256: \`$(cut -d' ' -f1 "$(ls source-*.sha256 | head -1)")\` (verified against download.qt.io)"
          echo
          echo "Modules: $(echo '${{ needs.prepare.outputs.submodules }}' | sed 's/,/, /g') (+ qtactiveqt on Windows)"
          echo
          echo "## Security patches"
          echo
          cat "$(ls patches-*.md | head -1)"
          echo
          echo "## SHA-256 of the packages"
          echo
          echo '```'
          sha256sum *.zip *.tar.xz
          echo '```'
          echo
          echo "Verify provenance with: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`"
        } > ../notes.md
        cat ../notes.md

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$TAG" \
          -R "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "Qt $QT_VERSION (release ${{ needs.prepare.outputs.release }})" \
          --notes-file notes.md \
          ${{ inputs.draft && '--draft' || '' }} \
          dist/*.zip dist/*.tar.xz dist/*.summary dist/*.opt
